packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@hono/node-server": 1.19.15
  body-parser: 2.3.0
  "@isaacs/brace-expansion": 5.0.9
  esbuild: 0.25.0
  express-rate-limit: 8.2.2
  fast-uri: 3.1.5
  flatted: 3.4.2
  hono: 4.12.34
  ip-address: 10.3.1
  js-yaml: 4.3.1
  lodash: 4.17.21
  nanoid: 3.3.18
  path-to-regexp: 8.4.0
  picomatch: 4.0.4
  postcss: 8.5.23
  postcss-selector-parser: 7.1.3
  qs: 6.15.2
  shell-quote: 1.9.0
  sharp: 0.35.3
  vite: 6.4.3
  vitest: 3.2.6
  "@babel/core": 7.29.6
  "ajv@^6": 6.14.0
  "ajv@^8": 8.18.0
  "brace-expansion@^1": 1.1.18
